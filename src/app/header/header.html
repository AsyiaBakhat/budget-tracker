<!-- Material Icons CDN (Agar index.html mein pehle se nahi hai) -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

<nav class="bottom-nav-bar">
  <!-- Dashboard Tab -->
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
    <span class="material-symbols-outlined">grid_view</span>
    <span class="nav-label">Dashboard</span>
  </a>

  <!-- Add Transaction Tab -->
  <a routerLink="/add-transaction" routerLinkActive="active" class="nav-item">
    <span class="material-symbols-outlined">add_circle</span>
    <span class="nav-label">Add</span>
  </a>

  <!-- Transactions History Tab -->
  <a routerLink="/transactions" routerLinkActive="active" class="nav-item">
    <span class="material-symbols-outlined">receipt_long</span>
    <span class="nav-label">History</span>
  </a>

  <!-- Visual Summary Tab -->
  <a routerLink="/summary" routerLinkActive="active" class="nav-item">
    <span class="material-symbols-outlined">pie_chart</span>
    <span class="nav-label">Summary</span>
  </a>
</nav>
