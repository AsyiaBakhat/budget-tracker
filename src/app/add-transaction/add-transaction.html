<!-- Material Icons & Font (Agar index.html mein pehle se hai toh isay hata dein) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
  rel="stylesheet" />

<div class="form-wrapper">
  <!-- Header Section -->
  <header class="form-header">
    <button type="button" class="btn-back" title="Back to Dashboard" routerLink="/">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div>
      <h1 class="page-title">Add New Transaction</h1>
      <p class="page-subtitle">Record a new income or expense entry</p>
    </div>
  </header>

  <!-- Main Form Card -->
  <div class="form-card">
    <form>
      <!-- Transaction Type Toggle (Expense vs Income) -->
      <div class="form-group">
        <label class="form-label">Transaction Type</label>
        <div class="type-selector">
          <button type="button" class="type-btn" [class.active-expense]="type === 'expense'"
            (click)="setType('expense')">
            <span class="material-symbols-outlined">trending_down</span>
            Expense
          </button>
          <button type="button" class="type-btn" [class.active-income]="type === 'income'" (click)="setType('income')">
            <span class="material-symbols-outlined">trending_up</span>
            Income
          </button>
        </div>
      </div>

      <!-- Amount Input -->
      <div class="form-group">
        <label for="amount" class="form-label">Amount</label>
        <div class="amount-input-box">
          <span class="currency-prefix">Rs.</span>
          <input type="number" id="amount" name="amount" [(ngModel)]="amount" class="form-control amount-field"
            placeholder="0.00" />
        </div>
      </div>

      <!-- Category & Date Row -->
      <div class="form-row">
        <!-- Category Dropdown -->
        <div class="form-group">
          <label for="category" class="form-label">Category</label>
          <div class="select-wrapper">
            <select id="category" name="category" [(ngModel)]="category" class="form-control">
              <option value="Groceries">Groceries</option>
              <option value="Food & Dining">Food & Dining</option>
              <option value="Utilities">Utilities & Bills</option>
              <option value="House Rent">House Rent</option>
              <option value="Transport">Transport & Fuel</option>
              <option value="Freelance">Freelance</option>
              <option value="Salary">Salary</option>
            </select>
          </div>
        </div>

        <!-- Date Picker -->
        <div class="form-group">
          <label for="date" class="form-label">Date</label>
          <input type="date" id="date" name="date" [(ngModel)]="date" class="form-control" />
        </div>
      </div>

      <!-- Note / Description -->
      <div class="form-group">
        <label for="note" class="form-label">Note <span class="optional-tag">(Optional)</span></label>
        <textarea id="note" name="note" rows="3" [(ngModel)]="note" class="form-control"
          placeholder="Add details like store name or purpose..."></textarea>
      </div>
      
      <!-- Action Buttons -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" routerLink="/">Cancel</button>
        <button type="button" class="btn-save" (click)="saveTransaction()">
          <span class="material-symbols-outlined">check_circle</span>
          Save Transaction
        </button>
      </div>
    </form>
  </div>
</div>
